# NexaCMS — example nginx server block (adapt paths/domains).
# Apache users don't need this: the shipped .htaccess does the same job.
server {
    listen 80;
    server_name example.com;
    root /var/www/nexacms;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64m;

    # Never serve configuration or data stores directly.
    location ~ ^/(config\.php|config_\.php)$ { deny all; }
    location ~ ^/(admin/database|content/backup|content/cache|content/sites)/ { deny all; }
    location ~ ^/content/uploads/nexa-downloads/ { deny all; }
    location ~ /\. { deny all; } # dotfiles (.git, .env, ...)

    # Per-subsite admin areas: /sites/<slug>/admin/... and /<slug>/admin/...
    # are served by the real /admin, keeping the subsite URL in the browser.
    # The multisite resolver validates the slug and who may enter.
    location ~ ^/(?:sites/)?[a-z0-9][a-z0-9\-]*/admin/(.*)$ {
        try_files $uri $uri/ /admin/$1?$query_string;
    }

    # Pretty permalinks: everything else falls through to the front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock; # adjust to your PHP-FPM
    }

    # Custom error pages via the CMS (optional; matches .htaccess behaviour
    # for a root install — prefix with your subfolder if installed in one).
    error_page 403 /index.php?nexa_error=403;
    error_page 500 /index.php?nexa_error=500;
}
